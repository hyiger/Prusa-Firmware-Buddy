name: Build Core One INDX firmware

# Custom unsigned firmware for the Core One INDX only. Flashing it requires a
# printer whose appendix is broken; see the release notes.
#
# The firmware reports the version in version.txt with a prerelease tag
# appended, for example 8.0.1-hy.1, so that it cannot be mistaken for Prusa's
# own build of that version. Pushing a tag named after the full version, such
# as v8.0.1-hy.1, builds it and publishes it as a release. Pushes to branches
# are built with the prerelease tag "dev" and never published. They build
# where a pull_request trigger would not: GitHub runs those on the merge with
# the base branch, so not at all while the pull request has a conflict.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Prerelease tag of the version, e.g. hy.1 for 8.0.1-hy.1"
        type: string
        default: "hy.1"
      create_release:
        description: "Publish a GitHub release with the built .bbf files"
        type: boolean
        default: false
      replace_release:
        description: "Move an existing release's tag to the built commit and replace its files"
        type: boolean
        default: false
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The firmware build number is derived from the parent commit count,
          # so a shallow clone silently produces build number 0.
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < version.txt)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            prerelease="${tag#"v${base}-"}"
            if [ "${prerelease}" = "${tag}" ]; then
              echo "::error::Tag ${tag} does not name version ${base} with a prerelease tag, such as v${base}-hy.1"
              exit 1
            fi
          else
            # Empty for a branch push, which has no inputs
            prerelease="${PRERELEASE_INPUT:-dev}"
            tag="v${base}-${prerelease}"
          fi
          # A semver prerelease, of which the .bbf header stores five characters
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "${prerelease}" =~ ^${identifier}(\.${identifier})*$ ]] || [ "${#prerelease}" -gt 5 ]; then
            echo "::error::Prerelease tag '${prerelease}' must be a semver prerelease of at most 5 characters"
            exit 1
          fi
          # The same count CMake takes the build number from; the full version
          # has to carry it.
          build_number="$(git rev-list --count HEAD)"
          {
            echo "tag=${tag}"
            echo "base=${base}"
            echo "version=${base}-${prerelease}"
            echo "suffix=-${prerelease}+${build_number}"
            echo "suffix_short=-${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache toolchain dependencies
        uses: actions/cache@v4
        with:
          path: .dependencies
          # The dependency manifest lives in bootstrap.py, so its hash is what
          # should invalidate the cache.
          key: deps-${{ runner.os }}-${{ hashFiles('utils/bootstrap.py') }}

      - name: Install build prerequisites
        # requests: bootstrap.py downloads the toolchain before it creates the
        #   project venv, so it has to be present up front (see README).
        # gettext: the resource step shells out to msgfmt to compile the
        #   translation catalogues. Undocumented, and absent on a clean runner.
        run: |
          python3 -m pip install requests
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Bootstrap
        run: python3 utils/bootstrap.py

      - name: Install ESP8266 SDK Python packages
        # bootstrap.py installs them into .venv only when it downloads the SDK,
        # and the cache restores the SDK into a fresh .venv. The Wi-Fi firmware
        # build checks for them.
        run: |
          set -euo pipefail
          sdk=(.dependencies/esp8266-rtos-sdk-*)
          PIP_CONSTRAINT="${sdk[0]}/pip-constraint.txt" \
            .venv/bin/python -m pip install --disable-pip-version-check -r "${sdk[0]}/requirements.txt"

      - name: Build
        # --bootloader yes builds only the image linked to run alongside the
        # bootloader (FLASH_ORIGIN 0x08020200). The 'no' variant links to
        # 0x08000000 for direct SWD flashing and is not usable via the
        # printer's own update path, so it is not built or published.
        # The suffixes start with '-', so they are joined to their options
        # with '=' to keep them from being parsed as options themselves.
        env:
          SUFFIX: ${{ steps.version.outputs.suffix }}
          SUFFIX_SHORT: ${{ steps.version.outputs.suffix_short }}
        run: >-
          python3 utils/build.py --preset coreone_indx --build-type release --bootloader yes
          "--version-suffix=${SUFFIX}" "--version-suffix-short=${SUFFIX_SHORT}"

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          products=(build/products/coreone_indx_release_boot_*.bbf)
          if [ "${#products[@]}" -ne 1 ] || [ ! -f "${products[0]}" ]; then
            echo "::error::Expected one image in build/products, found: ${products[*]}"
            exit 1
          fi
          mkdir -p dist
          # Named after the version the printer shows; the product name also
          # carries the build type and the build number.
          cp "${products[0]}" "dist/coreone_indx_${VERSION}.bbf"
          cd dist
          ls -l
          sha256sum -- *.bbf | tee SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coreone-indx-firmware-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BASE_VERSION: ${{ steps.version.outputs.base }}
          VERSION: ${{ steps.version.outputs.version }}
          REPLACE_RELEASE: ${{ inputs.replace_release }}
        run: |
          set -euo pipefail
          # A manual run tags the built commit, so it must not publish under a
          # tag that already names another one, unless asked to replace it.
          if tagged="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")" && [ "${tagged}" != "${GITHUB_SHA}" ]; then
            if [ "${REPLACE_RELEASE}" != "true" ]; then
              echo "::error::Tag ${TAG} already points at ${tagged}; build under another prerelease tag, or run with replace_release"
              exit 1
            fi
            echo "Moving tag ${TAG} from ${tagged} to ${GITHUB_SHA}"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          fi
          # envsubst takes the names of the variables it substitutes, unexpanded
          # shellcheck disable=SC2016
          envsubst '${BASE_VERSION} ${VERSION} ${GITHUB_SHA}' > notes.md <<'EOF'
          Unsigned custom firmware for the **Prusa Core One INDX only**, built from `${GITHUB_SHA}`.

          It is Prusa's official [${BASE_VERSION}](https://github.com/prusa3d/Prusa-Firmware-Buddy/releases/tag/v${BASE_VERSION}) with these additions:

          - **Filament slots**: each tool records the vendor and color of its filament, picked while loading the way an AMS does it. PrusaSlicer Filament Edition reads them over PrusaLink.
          - **Prusa Connect**: the printer reports the plain version to Connect, so uploads work.

          The printer shows its version as `${VERSION}`, so it can be told apart from Prusa's build. Prusa Connect is the exception, see below.

          ### Filament slots

          Loading filament from the Filament menu asks for the vendor and the color right after the type: Load, Change and autoload into a single tool show a vendor list and then a color palette with a swatch for each color. This takes the place of the color prompt of stock ${BASE_VERSION}, and follows its Ask Color On Load setting, which by default asks on a printer with more than one tool. The picked color becomes the color of the loaded filament, as the stock prompt's does, so the "Was filament successfully extruded?" step, the print's tool mapping screen and Prusa Connect show it. A Custom filament keeps the color set up with it, so only the vendor is asked for. After an unload, the tool keeps the vendor and color as its previous spool, so the next load starts at the same vendor and color.

          During a print, Filament Change in the Tune menu asks for the vendor and color of the new spool after "Change filament now?", starting at the tool's current ones, under the same setting. A filament runout keeps the vendor and color, as the same filament goes back in. M600 in the G-code, which is how the slicer changes colors, keeps the vendor but not the color: the tool shows the color the G-code names, or none. An M600 that switches to another material keeps neither.

          Change All and a load from G-code don't ask, and leave the tool with no vendor or color, and no previous spool either. A color that comes with such a load, from the G-code or the stock color prompt of Change All, is still reported as its hex code. Set the vendor and color in Filament > Filament Slots.

          Filament > Filament Slots lists the tools with the vendor, type and color of the filament in each, and corrects them without reloading. Changing the type there changes the loaded filament type without loading anything, as `M865 L` does. A vendor or color changed there, or with `M866`, is what PrusaLink and the tool mapping screen show; Prusa Connect keeps showing the color picked at the load.

          There are 16 preset vendors, listed with Generic first and the rest alphabetically (Generic, 3D-Fuel, Bambu Lab, colorFabb, Elegoo, eSun, Fiberlogy, Fillamentum, Hatchbox, Inland, Overture, Polymaker, Prusament, Siraya Tech, Spectrum, Sunlu), and 16 preset colors (Red, Green, Blue, Cyan, Magenta, Yellow, Black, White, Orange, Brown, Gray, Purple, Pink, Silver, Natural, Gold), plus 8 user slots for each. Orange is the orange of the printer's own interface, #F8651B, as web orange looks yellow on its display. Filament > Manage Filaments has Edit Vendors and Edit Colors to name the user slots and set the hex code of a user color, and Enable Vendors and Enable Colors to choose which entries the lists show.

          PrusaLink reports the slots at `/api/v1/tools`, with the same credentials as its other requests, and `M866 T<tool> V"<vendor>" C"<color>"` sets them from G-code. PrusaSlicer Filament Edition 1.16.0 and later read them with Sync Filaments from Printer, which works only over PrusaLink, not over Prusa Connect. Setup steps with screenshots are in the [Filament Slots and Sync user guide](https://github.com/hyiger/PrusaSlicer/wiki/Filament-Slots-and-Sync).

          ### Prusa Connect

          Prusa Connect has turned off file transfer for firmware versions it does not recognize, such as one with a prerelease tag like `${VERSION}`. Uploads then failed with "The current printer firmware version do not support binary gcodes", and Connect marked the firmware as unsupported. This build reports the plain `${BASE_VERSION}` to Connect, without the prerelease tag or build number, so Connect shows `${BASE_VERSION}`. The printer's screens, PrusaLink and M115 still report `${VERSION}`, and M115, PrusaLink and Version Info add the build number after a `+`.

          Connect may offer a newer stock firmware as an update. Installing it replaces this build.

          ### Flashing

          Requires a printer with the appendix broken, as the build is unsigned.

          Flash `coreone_indx_${VERSION}.bbf` from a USB drive, the same way as a stock firmware update.

          Do not flash this on a non-INDX Core One. Both variants report `PRINTER_TYPE 7` and share a bootloader, so nothing will stop you.
          EOF
          # Upsert, so re-running against an existing tag refreshes the
          # release instead of failing on an already-created one.
          title="Core One INDX ${VERSION} (unsigned)"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.bbf dist/SHA256SUMS --clobber
            gh release edit "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file notes.md \
              --prerelease
          else
            gh release create "${TAG}" dist/*.bbf dist/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file notes.md \
              --prerelease
          fi
