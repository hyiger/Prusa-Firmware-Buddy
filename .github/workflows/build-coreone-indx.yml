name: Build Core One INDX firmware

# Custom unsigned firmware for the Core One INDX only. Flashing it requires a
# printer whose appendix is broken; see the release notes.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub release with the built .bbf files"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The firmware build number is derived from the parent commit count,
          # so a shallow clone silently produces build number 0.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache toolchain dependencies
        uses: actions/cache@v4
        with:
          path: .dependencies
          # The dependency manifest lives in bootstrap.py, so its hash is what
          # should invalidate the cache.
          key: deps-${{ runner.os }}-${{ hashFiles('utils/bootstrap.py') }}

      - name: Install build prerequisites
        # requests: bootstrap.py downloads the toolchain before it creates the
        #   project venv, so it has to be present up front (see README).
        # gettext: the resource step shells out to msgfmt to compile the
        #   translation catalogues. Undocumented, and absent on a clean runner.
        run: |
          python3 -m pip install requests
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Bootstrap
        run: python3 utils/bootstrap.py

      - name: Build
        # --bootloader yes builds only the image linked to run alongside the
        # bootloader (FLASH_ORIGIN 0x08020200). The 'no' variant links to
        # 0x08000000 for direct SWD flashing and is not usable via the
        # printer's own update path, so it is not built or published.
        run: python3 utils/build.py --preset coreone_indx --build-type release --final --bootloader yes

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/products/coreone_indx_release_boot_*.bbf dist/
          # Surface the resolved version so later steps and humans can see it.
          version="$(tr -d '[:space:]' < version.txt)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -l dist/
          sha256sum dist/*.bbf | tee dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coreone-indx-firmware-${{ steps.collect.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          set -euo pipefail
          # On a tag push reuse that tag; on a manual run let gh create one
          # from the built commit so the release is always reproducible.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${VERSION}-$(git rev-parse --short HEAD)"
          fi
          cat > notes.md <<EOF
          Unsigned custom firmware for the **Prusa Core One INDX only**.

          Built from \`${GITHUB_SHA}\`.

          ### Change

          Restores the tool-offset-sensor probing retry budget to \`TOTAL_PROBING + 1\`
          (41 attempts). Upstream 6.9.0 reduced it to 3, which makes the XY tool offset
          calibration fail with \`Initial probing failed, sensor Z is NaN\` when the
          nozzle carries any residue.

          ### Flashing

          Requires a printer with the appendix broken, as the build is unsigned.

          Flash \`coreone_indx_release_boot_*.bbf\` from a USB drive, the same way
          as a stock firmware update.

          Do not flash this on a non-INDX Core One. Both variants report
          \`PRINTER_TYPE 7\` and share a bootloader, so nothing will stop you.
          EOF
          # Upsert, so re-running against an existing tag refreshes the
          # release instead of failing on an already-created one.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.bbf dist/SHA256SUMS --clobber
            gh release edit "$tag" \
              --title "Core One INDX ${VERSION} (unsigned)" \
              --notes-file notes.md \
              --prerelease
          else
            gh release create "$tag" dist/*.bbf dist/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "Core One INDX ${VERSION} (unsigned)" \
              --notes-file notes.md \
              --prerelease
          fi
