name: Build Core One INDX firmware

# Custom unsigned firmware for the Core One INDX only. Flashing it requires a
# printer whose appendix is broken; see the release notes.
#
# The firmware reports the version in version.txt with a prerelease tag
# appended, for example 8.0.1-hy.1, so that it cannot be mistaken for Prusa's
# own build of that version. Pushing a tag named after the full version, such
# as v8.0.1-hy.1, builds it and publishes it as a release. Pushes to branches
# are built with the prerelease tag "dev" and never published. They build
# where a pull_request trigger would not: GitHub runs those on the merge with
# the base branch, so not at all while the pull request has a conflict.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Prerelease tag of the version, e.g. hy.1 for 8.0.1-hy.1"
        type: string
        default: "hy.1"
      create_release:
        description: "Publish a GitHub release with the built .bbf files"
        type: boolean
        default: false
      replace_release:
        description: "Move an existing release's tag to the built commit and replace its files"
        type: boolean
        default: false
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The firmware build number is derived from the parent commit count,
          # so a shallow clone silently produces build number 0.
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < version.txt)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            prerelease="${tag#"v${base}-"}"
            if [ "${prerelease}" = "${tag}" ]; then
              echo "::error::Tag ${tag} does not name version ${base} with a prerelease tag, such as v${base}-hy.1"
              exit 1
            fi
          else
            # Empty for a branch push, which has no inputs
            prerelease="${PRERELEASE_INPUT:-dev}"
            tag="v${base}-${prerelease}"
          fi
          # A semver prerelease, of which the .bbf header stores five characters
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "${prerelease}" =~ ^${identifier}(\.${identifier})*$ ]] || [ "${#prerelease}" -gt 5 ]; then
            echo "::error::Prerelease tag '${prerelease}' must be a semver prerelease of at most 5 characters"
            exit 1
          fi
          # The same count CMake takes the build number from; the full version
          # has to carry it.
          build_number="$(git rev-list --count HEAD)"
          {
            echo "tag=${tag}"
            echo "base=${base}"
            echo "version=${base}-${prerelease}"
            echo "suffix=-${prerelease}+${build_number}"
            echo "suffix_short=-${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache toolchain dependencies
        uses: actions/cache@v4
        with:
          path: .dependencies
          # The dependency manifest lives in bootstrap.py, so its hash is what
          # should invalidate the cache.
          key: deps-${{ runner.os }}-${{ hashFiles('utils/bootstrap.py') }}

      - name: Install build prerequisites
        # requests: bootstrap.py downloads the toolchain before it creates the
        #   project venv, so it has to be present up front (see README).
        # gettext: the resource step shells out to msgfmt to compile the
        #   translation catalogues. Undocumented, and absent on a clean runner.
        run: |
          python3 -m pip install requests
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Bootstrap
        run: python3 utils/bootstrap.py

      - name: Install ESP8266 SDK Python packages
        # bootstrap.py installs them into .venv only when it downloads the SDK,
        # and the cache restores the SDK into a fresh .venv. The Wi-Fi firmware
        # build checks for them.
        run: |
          set -euo pipefail
          sdk=(.dependencies/esp8266-rtos-sdk-*)
          PIP_CONSTRAINT="${sdk[0]}/pip-constraint.txt" \
            .venv/bin/python -m pip install --disable-pip-version-check -r "${sdk[0]}/requirements.txt"

      - name: Build
        # --bootloader yes builds only the image linked to run alongside the
        # bootloader (FLASH_ORIGIN 0x08020200). The 'no' variant links to
        # 0x08000000 for direct SWD flashing and is not usable via the
        # printer's own update path, so it is not built or published.
        # The suffixes start with '-', so they are joined to their options
        # with '=' to keep them from being parsed as options themselves.
        # Warnings are errors, as in Prusa's own CI, so that a change which
        # would fail there fails here too.
        env:
          SUFFIX: ${{ steps.version.outputs.suffix }}
          SUFFIX_SHORT: ${{ steps.version.outputs.suffix_short }}
        run: >-
          python3 utils/build.py --preset coreone_indx --build-type release --bootloader yes
          "--version-suffix=${SUFFIX}" "--version-suffix-short=${SUFFIX_SHORT}"
          -DCUSTOM_COMPILE_OPTIONS:STRING=-Werror

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          products=(build/products/coreone_indx_release_boot_*.bbf)
          if [ "${#products[@]}" -ne 1 ] || [ ! -f "${products[0]}" ]; then
            echo "::error::Expected one image in build/products, found: ${products[*]}"
            exit 1
          fi
          mkdir -p dist
          # Named after the version the printer shows; the product name also
          # carries the build type and the build number.
          cp "${products[0]}" "dist/coreone_indx_${VERSION}.bbf"
          cd dist
          ls -l
          sha256sum -- *.bbf | tee SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coreone-indx-firmware-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BASE_VERSION: ${{ steps.version.outputs.base }}
          VERSION: ${{ steps.version.outputs.version }}
          REPLACE_RELEASE: ${{ inputs.replace_release }}
        run: |
          set -euo pipefail
          # A manual run tags the built commit, so it must not publish under a
          # tag that already names another one, unless asked to replace it.
          if tagged="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")" && [ "${tagged}" != "${GITHUB_SHA}" ]; then
            if [ "${REPLACE_RELEASE}" != "true" ]; then
              echo "::error::Tag ${TAG} already points at ${tagged}; build under another prerelease tag, or run with replace_release"
              exit 1
            fi
            echo "Moving tag ${TAG} from ${tagged} to ${GITHUB_SHA}"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          fi
          # envsubst takes the names of the variables it substitutes, unexpanded
          # shellcheck disable=SC2016
          envsubst '${BASE_VERSION} ${VERSION} ${GITHUB_SHA}' > notes.md <<'EOF'
          Unsigned custom firmware for the **Prusa Core One INDX only**, built from `${GITHUB_SHA}`.

          It is Prusa's official [${BASE_VERSION}](https://github.com/prusa3d/Prusa-Firmware-Buddy/releases/tag/v${BASE_VERSION}) with these additions:

          - **Filament slots**: each tool records the vendor and color of its filament, picked while loading the way an AMS does it. PrusaSlicer Filament Edition reads them over PrusaLink.
          - **Autoload into any tool**: pushing filament into the sensor of an empty tool loads that tool, picking it up from its dock. Not yet verified on hardware.
          - **Prusa Connect**: the printer reports the plain version to Connect, so uploads work.
          - **Nozzle temperature**: INDX tools take targets up to 300 °C, where stock ${BASE_VERSION} stops at 290 °C. Not yet verified on hardware.
          - **Automatic pressure advance (experimental), Core One INDX only**: the printer can measure the pressure advance of each tool with the load cell at the start of a print and use it in place of the one from the filament profile. Off by default. **Experimental and not yet fully baked**: tried on one printer with three filaments so far, where it came out within about 30 % of what printed line tests of the same speed looked best with.
          - **Formatting the USB drive**: Settings > System > Format USB Drive erases the drive in the printer and makes it FAT32, the file system the printer reads. Not yet tried on a printer.
          - **Aux chamber light**: Settings > Lights has a switch for an LED strip wired to the GPIO board's first open-drain output. Not yet verified on hardware.

          The printer shows its version as `${VERSION}`, so it can be told apart from Prusa's build. Prusa Connect is the exception, see below.

          ### Filament slots

          Loading filament from the Filament menu asks for the vendor and the color right after the type: Load, Change and autoload into a single tool show a vendor list and then a color palette with a swatch for each color. This takes the place of the color prompt of stock ${BASE_VERSION}, and follows its Ask Color On Load setting, which by default asks on a printer with more than one tool. The picked color becomes the color of the loaded filament, as the stock prompt's does, so the "Was filament successfully extruded?" step, the print's tool mapping screen and Prusa Connect show it. A Custom filament keeps the color set up with it, so only the vendor is asked for. After an unload, the tool keeps the vendor and color as its previous spool, so the next load starts at the same vendor and color.

          During a print, Filament Change in the Tune menu asks for the vendor and color of the new spool after "Change filament now?", starting at the tool's current ones, under the same setting. A filament runout keeps the vendor and color, as the same filament goes back in. M600 in the G-code, which is how the slicer changes colors, keeps the vendor but not the color: the tool shows the color the G-code names, or none. An M600 that switches to another material keeps neither.

          Change All and a load from G-code don't ask, and leave the tool with no vendor or color, and no previous spool either. A color that comes with such a load, from the G-code or the stock color prompt of Change All, is still reported as its hex code. Set the vendor and color in Filament > Filament Slots.

          Filament > Filament Slots lists the tools with the vendor, type and color of the filament in each, and corrects them without reloading. Changing the type there changes the loaded filament type without loading anything, as `M865 L` does. A vendor or color changed there, or with `M866`, is what PrusaLink and the tool mapping screen show; Prusa Connect keeps showing the color picked at the load.

          There are 16 preset vendors, listed with Generic first and the rest alphabetically (Generic, 3D-Fuel, Bambu Lab, colorFabb, Elegoo, eSun, Fiberlogy, Fillamentum, Hatchbox, Inland, Overture, Polymaker, Prusament, Siraya Tech, Spectrum, Sunlu), and 16 preset colors (Red, Green, Blue, Cyan, Magenta, Yellow, Black, White, Orange, Brown, Gray, Purple, Pink, Silver, Natural, Gold), plus 8 user slots for each. Orange is the orange of the printer's own interface, #F8651B, as web orange looks yellow on its display. Filament > Manage Filaments has Edit Vendors and Edit Colors to name the user slots and set the hex code of a user color, and Enable Vendors and Enable Colors to choose which entries the lists show.

          PrusaLink reports the slots at `/api/v1/tools`, with the same credentials as its other requests, and `M866 T<tool> V"<vendor>" C"<color>"` sets them from G-code. PrusaSlicer Filament Edition 1.16.0 and later read them with Sync Filaments from Printer, which works only over PrusaLink, not over Prusa Connect. Setup steps with screenshots are in the [Filament Slots and Sync user guide](https://github.com/hyiger/PrusaSlicer/wiki/Filament-Slots-and-Sync).

          ### Autoload into any tool

          Stock ${BASE_VERSION} autoloads filament only into the tool on the head, and the INDX docks its tool after every print and every load, so autoload hardly ever happened. In this build, pushing filament into the side filament sensor of a tool loads that tool when the printer has it as empty, that is with no filament type, as after an unload. The printer first asks for the filament type, and, as Ask Color On Load says, its vendor and color as described under Filament slots, before anything moves. Return there, or pulling the filament back out, leaves everything as it was. It then picks up the tool, docking the one on the head first if there is one, loads it the same way as Filament > Load, and docks it again. Filament pushed into another empty tool meanwhile loads next, so several tools can be filled one after another. If the printer can't pick up the tool, it shows a Tool Not Picked warning. It now also shows this warning when Load All, Change All, Unload All, `M701` or `M702` can't pick up a tool outside a print, where stock ${BASE_VERSION} stops without a message.

          Settings > Hardware > Filament Autoloading turns it on and off together with the stock autoload, and it is on by default. Filament pushed in does nothing while a print runs or its preview is open, while the tool list of Filament > Load, Unload, Change or Purge, the Load All, Change All or Unload All screen, Sensor Info or Cold Pull is open, or for a tool that the printer has as loaded. Pushed in while another command runs, such as another load or unload, it loads once that command is done. A tool whose filament was pulled out by hand without an unload still counts as loaded, so unload it from the Filament menu first. Filament pushed into the sensor of the tool on the head starts the stock autoload, as before.

          This has not been tested on a printer yet.

          ### Prusa Connect

          Prusa Connect has turned off file transfer for firmware versions it does not recognize, such as one with a prerelease tag like `${VERSION}`. Uploads then failed with "The current printer firmware version do not support binary gcodes", and Connect marked the firmware as unsupported. This build reports the plain `${BASE_VERSION}` to Connect, without the prerelease tag or build number, so Connect shows `${BASE_VERSION}`. The printer's screens, PrusaLink and M115 still report `${VERSION}`, and M115, PrusaLink and Version Info add the build number after a `+`.

          Connect may offer a newer stock firmware as an update. Installing it replaces this build.

          ### Nozzle temperature

          Stock ${BASE_VERSION} caps an INDX tool's target at 290 °C, below the 300 °C the INDX head itself accepts. This build raises the printer's limit to match the head, so the menus, filament presets and `M104`/`M109` can set up to 300 °C. A higher target is still lowered to 300 °C without a message. The printer stops with a MAXTEMP error if a nozzle reads above 315 °C instead of 305 °C, and the INDX head still shuts its heater off on its own above 330 °C.

          This has not been tested on a printer. Nobody has yet confirmed that a nozzle settles at 300 °C without overshooting into the MAXTEMP error, or checked the head's infrared temperature reading against a thermometer that high. Check this on your own printer before printing at 300 °C.

          ### Automatic pressure advance (experimental)

          **This is experimental and not yet fully baked.** Its results have been off by up to a third from what printed tests looked best with, it has been tried on one printer only, and how it measures has changed between releases and may change again. Leave Settings > Auto Pressure Advance off for prints that matter, unless you have checked what it measures against a printed test of your own.

          This is for the Core One INDX only. It measures in the wastebin and relies on the nozzle cleaner, so there is nothing of it in the firmware of printers with a Nextruder, and it is not turned on for the Core One L INDX, where it has not been tried.

          PrusaSlicer's Core One INDX profiles send two commands that stock ${BASE_VERSION} ignores: an `M574` for each tool before the tool offset calibration, and `M573 R` after the `M572` of each filament. This build acts on them once Settings > Auto Pressure Advance is turned on. It is off by default, and the commands are ignored as before while it is off.

          With it on, the tool offset calibration at the start of a print measures every tool the print uses while it has the tool in the nozzle cleaner. The tool heats up to the temperature of its filament, moves a centimeter along the cleaner from the purge position, to where the silicone does not touch the nozzle, and extrudes for 15 to 30 seconds, alternating between a slow and a fast flow, while the load cell reads the force on the nozzle. The printer looks for the pressure advance with which that force changes exactly when the flow does, and the print uses it for that tool in place of the one from the filament profile. The screen shows "Calibrating pressure advance" with the tool and the step meanwhile, and then the value it has found for the tool, or that the calibration has failed. This takes 15 to 60 mm of filament per tool, depending on how fast the print goes. A tool whose measurement fails prints with the pressure advance from the profile, and so does a tool with flexible filament, which the slicer does not ask to be measured. The measured values are forgotten when the next print starts.

          `M573` without parameters prints the measured values, and `M573 S1` and `M573 S0` turn the setting on and off. `M574 T<temperature> F<mm/s> I` measures the picked tool right away and prints the result. That works with the setting off too, so the measurement can be tried without it changing any print. X and Y have to be homed first, and the tool ends up purged and cleaned in the nozzle cleaner. The fast flow of the measurement is `F`, up to 8 mm/s of filament, and `L` sets the slow one, which is a tenth of the fast one otherwise, but 0.2 mm/s at the least. `Y` moves the spot of the measurement along the cleaner, in the coordinates of `G750`, from 76 to 93, with the purge position at 87 and the default at 77.

          Each step of a measurement is logged: the pressure advance tried and how far the force then lags behind the flow, as a whole and separately for the flow going up and going down. Settings > System > Save Logs To File puts the log on the USB drive, which is the easiest way to get it. With `D`, `M574` also logs the course of the force around the flow changes, and with `P` and `Q` it tries values spread evenly between the two instead of closing in on the result, which shows how the force responds to pressure advance values it would otherwise not try. A calibration that fails says why, on the screen and in the reply to `M574 ... I`. The steps and the result are also sent as the `pa_calib_step` and `pa_calib` metrics, and with the `pa_calib_sample` and `pa_calib_pattern` metrics turned on by `M331`, so is every load cell sample a measurement is made from.

          This is new, so treat what it comes up with as a suggestion. It has been tried on one printer with one nozzle and three filaments, a PCTG and two PLAs, against line tests printed at 100 and 200 mm/s. What that showed:

          - The pressure advance a print looks best with is not one number per filament. It goes down the faster the print pushes filament, and the hotter the nozzle is. The same PLA looked best with clearly less at 200 mm/s than at 100 mm/s.
          - The measurement follows that, which is why it is done at the flow the slicer says the print goes at, and why a result only compares with a line test printed at that speed.
          - Compared that way, the measurement was within about 30 % of the line test each time, sometimes above it and sometimes below. For the PCTG it was a quarter to a third low.
          - A measurement taken right after the nozzle has reached its temperature, which is when a print takes it, comes out up to 15 % lower than the same one taken a minute later.

          So it will not beat a pressure advance that has been tuned by hand for the speed a print goes at. It can do better than a value from a profile that was tuned for another speed or another material. Compare what `M574 ... I` comes up with to a printed test of your own, at the speed you print at, before leaving the setting on for prints that matter.

          The first release of this, 8.0.1-hy.4, measured at 2 mm/s of filament at the most, whatever the print's flow. That matched the PCTG it was tried with and came out at more than double for one of the PLAs.

          ### Formatting the USB drive

          Settings > System > Format USB Drive erases the drive that is in the printer and makes a single FAT32 volume of all of it, or of its first 2.2 TB on a larger drive, after asking. That is the file system the printer reads, so it also takes a drive the printer turns down with "Unknown file system", such as one that came formatted as exFAT, and a drive above 32 GB, which Windows does not offer to format as FAT32.

          It is a quick format: the file system is made anew and the old data is not overwritten. The printer writes about 8 MB for a 32 GB drive and 64 MB for a 256 GB one, over a USB port that passes 1 MB a second at the most, so count with ten seconds or so for the first and more than a minute for the second. The screen shows "Formatting USB drive" until it is done; leave the drive in until then. A format that is cut short, by a drive pulled out or one that stops taking writes, leaves the drive with no file system at all, never with the old one half overwritten: the printer then shows it as empty, says "Unknown file system" once something opens a file on it, and formatting it again puts it right.

          The printer refuses while it prints, while a file is being transferred and while Save Logs To File is on. A drive smaller than about 38 MB is too small for FAT32: the printer says so and leaves it as it is.

          This has been checked on a computer only, with the printer's own file system code formatting drive images from 40 MB to 1 TB that `fsck` then found no fault with, and being cut short after each of its writes in turn. It has not been run on a printer yet.

          ### Aux chamber light

          Settings > Lights, also reachable from Tune during a print, has an Aux Chamber Light switch for an LED strip wired to the first open-drain output of the GPIO board, which is pin 0 of the board's IO expander. The switch sends `M262 P0 B0` and then `M264 P0 B1` or `M264 P0 B0`, the commands start and end G-code can use for the same strip, and it follows what such G-code sets. During a print the switch spins until the printer gets to the command, after the one it is running. The printer keeps the state across restarts. The switch is hidden when the GPIO board does not answer at startup.

          This has not been tested on a printer yet.

          ### Flashing

          Requires a printer with the appendix broken, as the build is unsigned.

          Flash `coreone_indx_${VERSION}.bbf` from a USB drive, the same way as a stock firmware update.

          Do not flash this on a non-INDX Core One. Both variants report `PRINTER_TYPE 7` and share a bootloader, so nothing will stop you.
          EOF
          # Upsert, so re-running against an existing tag refreshes the
          # release instead of failing on an already-created one.
          title="Core One INDX ${VERSION} (unsigned)"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.bbf dist/SHA256SUMS --clobber
            gh release edit "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file notes.md \
              --prerelease
          else
            gh release create "${TAG}" dist/*.bbf dist/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file notes.md \
              --prerelease
          fi
